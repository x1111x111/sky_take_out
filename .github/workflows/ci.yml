name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_delivery.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sky-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sky-admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sky-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -Dtest=PasswordTest,DishServiceImplCacheTest,EmployeeSerializationTest clean package
